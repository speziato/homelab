[env]
'_'.file = "{{config_root}}/secrets/.env"

[tools]
opentofu = "1.9.0"

[tasks.import]
description = "Creates a tf file for an existing resource, ready to import"
run = """
#!/usr/bin/env bash
set -e

# Ask for type
read -rp "Enter resource type (lxc/vm): " TYPE
if [[ "$TYPE" != "lxc" && "$TYPE" != "vm" ]]; then
  echo "❌ Invalid type: $TYPE. Must be 'lxc' or 'vm'."
  exit 1
fi

# Ask for ID
read -rp "Enter resource ID: " ID
if [[ -z "$ID" ]]; then
  echo "❌ Resource ID cannot be empty."
  exit 1
fi

# Ask for name
read -rp "Enter resource name: " NAME
if [[ -z "$NAME" ]]; then
  echo "❌ Resource name cannot be empty."
  exit 1
fi

# Determine resource type
if [[ "$TYPE" == "vm" ]]; then
  RESOURCE_TYPE="proxmox_vm_qemu"
else
  RESOURCE_TYPE="proxmox_lxc"
fi

IMPORT_FILE="import_${TYPE}_${NAME}.tf"
TARGET_FILE="${TYPE}_${NAME}.tf"

# Create import file
cat > "$IMPORT_FILE" <<EOF
import {
  to = ${RESOURCE_TYPE}.${NAME}
  id = "hypervisor/${TYPE}/${ID}"
}
EOF

echo "📝 Created $IMPORT_FILE"

# Generate config with tofu
echo "🔧 Running tofu plan to generate config..."
tofu plan -generate-config-out="./${TARGET_FILE}"

# Insert import block at top of generated file
cat "$IMPORT_FILE" "$TARGET_FILE" > "${TARGET_FILE}.tmp" && mv "${TARGET_FILE}.tmp" "$TARGET_FILE"

# Remove temporary import file
rm "$IMPORT_FILE"

echo "✅ Import setup complete!"
echo "  - Config file: ${TARGET_FILE}"
"""