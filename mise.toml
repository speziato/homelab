[env]
KUBECONFIG="{{config_root}}/kubeconfig"
KUBECTL_EXTERNAL_DIFF = "dyff between --omit-header --set-exit-code"
TALOSCONFIG="{{config_root}}/talosconfig"
HELM_REPOSITORY_CACHE="{{config_root}}/.helm/cache"
HELM_REPOSITORY_CONFIG="{{config_root}}/.helm/repositories.yaml"

[settings]
lockfile = true
quiet = true
[settings.task]
output = "prefix"

[vars]
KUBE_VERSION="1.34.1"
TALOS_VERSION="1.14.4"

[tools]
dyff = "1.10.5"
helm = "4.3.1"
kubectl = "1.37.1"
kustomize = "5.8.3"
stern = "1.35.0"
talosctl = "1.14.4"
yq = "4.54.1"
"github:kubevirt/kubevirt" = { rename_exe = "virtctl", version = "1.7.0" }
"github:patrickdappollonio/kubectl-slice" = "1.4.2"
"github:cloudnative-pg/cloudnative-pg" = { version = "1.30.1", asset_pattern = "kubectl-cnpg_{{ version }}_{{ os(macos='darwin') }}_{{ arch(x64='x86_64') }}.tar.gz" }
"github:AGWA/git-crypt" = { version = "0.8.0", os = "linux" }

[tasks."config:talos"]
dir ="{{ config_root }}/talos"
run = """
#!/usr/bin/env bash
mise run gen-config
cp talosconfig "{{config_root}}/talosconfig"
"""
[tasks."config:kube"]
dir = "{{ config_root }}/talos"
run = """
#!/usr/bin/env bash
talosctl kubeconfig - > {{config_root}}/kubeconfig
"""

[tasks.debug-node]
run = """
#!/usr/bin/env bash

kubectl debug $(kubectl get nodes -o name | head -n 1) \
  -it \
  -n kube-system \
  --image=nicolaka/netshoot \
  --profile=sysadmin \
  -- bash
"""

[tasks."renovate:run-local"]
run = """
#!/usr/bin/env bash

set -euo pipefail
[[ -n $GITHUB_TOKEN ]] || (echo "You must create the GITHUB_TOKEN env variable" && exit 1)
OUT={{config_root}}/renovate/reports

mkdir -p $OUT

NOW=$(date --iso-8601=seconds)

podman run --rm \
  --userns=keep-id:uid=12021,gid=12021 \
  -v "{{config_root}}/sd:/repo/sd:ro" \
  -v "{{config_root}}/workload:/repo/workload:ro" \
  -v "{{config_root}}/renovate-local.json:/repo/renovate-local.json:ro" \

  -w /repo \
  -v "$OUT:/out" \
  -e RENOVATE_CONFIG_FILE=/repo/renovate-local.json \
  -e RENOVATE_GITHUB_COM_TOKEN=$GITHUB_TOKEN \
  -e LOG_LEVEL=debug -e LOG_FILE_FORMAT=json -e LOG_FILE=/out/log-$NOW.json \
  ghcr.io/renovatebot/renovate:44.181@sha256:17a72d4e9787445c5047cfb20989b033a270833521fd0485c6372bdee21f92eb renovate --platform=local --dry-run=lookup
"""

[tasks."renovate:reporter"]
run = """
#!/usr/bin/env bash
podman run --rm \
  -p 8080:8080 \
  -v "{{config_root}}/renovate/reports:/logs:ro" \
  ghcr.io/acaylor/renovate-reporter:v0.2.0
"""
