# docker-compose.yml example for https://github.com/ServerContainers/samba
name: nas
secrets:
  qbittorrent_conf:
    file: ./qbittorrent/secrets/qBittorrent.conf
services:
  qbittorrent:
    user: "1000:1000"
    restart: always
    # image: docker.io/wernight/qbittorrent@sha256:c3d5cd01e20ddaeec3091e5588d5a56fd01d6c377655e9fed98724bf7bf786c1 # stable as of 30/05/2025
    build:
      context: qbittorrent
    secrets:
      # note: this will be mounted as a secret and likely the ownership will change:
      # DO NOT COMMIT WITHOUT REVERTING OWNERSHIP
      - qbittorrent_conf
    ports:
      - 8080:8080
    command: sh -c "ln -s -f /run/secrets/qbittorrent_conf /config/qBittorrent.conf && qbittorrent-nox"
    volumes:
      - ./qbittorrent/torrents:/downloads:U
      - ./qbittorrent/config:/config:U
      - ./qbittorrent/torrents:/torrents:U
  samba:
    build: .
    image: ghcr.io/servercontainers/samba
    restart: always
    # note that this network_mode makes it super easy (especially for zeroconf) but is not as safe as exposing ports directly
    # more about that here: https://book.hacktricks.wiki/en/linux-hardening/privilege-escalation/docker-security/docker-breakout-privilege-escalation/index.html#hostnetwork
    network_mode: host
    # uncomment to solve bug: https://github.com/ServerContainers/samba/issues/50 - wsdd2 only - not needed for samba
    #cap_add:
    #  - CAP_NET_ADMIN
    env_file:
      - path: ./samba/secrets/nas-credentials.env
        required: true
    environment:
      # uncomment to enable fail fast (currently only fails fast if there are conflicts/errors during user/group creation)
      #FAIL_FAST: 1

      MODEL: 'TimeCapsule'
      AVAHI_NAME: StorageServer

      SAMBA_CONF_LOG_LEVEL: 2

      # uncomment to disable optional services
      WSDD2_DISABLE: 1
      AVAHI_DISABLE: 1
      NETBIOS_DISABLE: 1

      UID_rick: 1000
      GID_rick: 1000
      GROUPS_rick: WORKGROUP 

      SAMBA_VOLUME_CONFIG_media: "[Media]; path=/share/media; valid users = rick; available = yes; browsable = yes; writable = yes; read only = no; public = yes; guest ok = yes"
      SAMBA_VOLUME_CONFIG_books: "[Books]; path=/share/books; valid users = rick; available = yes; browsable = yes; writable = yes; read only = no; public = yes; guest ok = yes"

    volumes:
      # avoid loops when mounting folders to /shares (I'd recommend explicit mapping for each share)
      - /share/media:/share/media
      - /share/books:/share/books