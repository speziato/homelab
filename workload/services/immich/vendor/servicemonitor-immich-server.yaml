# Source: immich/templates/server.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-server
  labels:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: server
    app.kubernetes.io/version: v3.2.0
    helm.sh/chart: immich-0.13.2
  namespace: services
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - services
  selector:
    matchLabels:
      app.kubernetes.io/service: immich-server
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: immich
  endpoints:
    - port: metrics-api
      scheme: http
    - port: metrics-ms
      scheme: http
