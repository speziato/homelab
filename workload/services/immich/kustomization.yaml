apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: services
resources:
- vendor
- resources/pvc-library.yaml

patches:
  - path: ./patches/add-tmp-emptydir.yaml

secretGenerator:
  - name: immich-database
    envs:
      - ./secrets/immich-database.env
    options:
      disableNameSuffixHash: true
