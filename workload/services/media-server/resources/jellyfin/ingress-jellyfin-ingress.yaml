apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-sd
    haproxy.org/timeout-server: "3600s"
    haproxy.org/timeout-tunnel: "3600s"
spec:
  ingressClassName: haproxy
  rules:
    - host: jellyfin.lan.speziato.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  number: 8096
  tls:
    - hosts:
        - jellyfin.lan.speziato.dev
      secretName: jellyfin-tls
