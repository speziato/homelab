# ServiceAccount for the deployments
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wait-for-job

---
# Role to watch Job status
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-watcher
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "watch", "list"]

---
# RoleBinding to grant the ServiceAccount access
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wait-for-job-job-watcher
subjects:
- kind: ServiceAccount
  name: wait-for-job
  namespace: default
roleRef:
  kind: Role
  name: job-watcher
  apiGroup: rbac.authorization.k8s.io
