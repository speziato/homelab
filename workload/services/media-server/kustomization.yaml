    files:
      - bazarr.yaml=./config/secrets/bazarr.yaml
      - lidarr.xml=./config/secrets/lidarr.xml
      - prowlarr.xml=./config/secrets/prowlarr.xml
      - qBittorrent.conf=./config/secrets/qBittorrent.conf
      - radarr.xml=./config/secrets/radarr.xml
      - sonarr.xml=./config/secrets/sonarr.xml
