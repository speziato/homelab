apiVersion: batch/v1
kind: Job
metadata:
  name: media-library-restore-from-backups
spec:
  template:
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - image: ogivuk/rsync:x64
          name: populator
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile: 
              type: RuntimeDefault
          resources: 
            requests:
              cpu: 1000m
              memory: 512Mi
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "starting rsync..."
              rsync -avzh /mnt/backups/media-server/ /mnt/media-server
              echo "done"
          volumeMounts:
            - name: backups
              mountPath: /mnt/backups
            - name: media-server
              mountPath: /mnt/media-server
      restartPolicy: Never
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: backups-hostpath
        - name: media-server
          persistentVolumeClaim:
            claimName: media-server
