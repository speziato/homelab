apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis
  labels:
    helm.sh/chart: aegis-2.1.1
    app.kubernetes.io/name: aegis
    app.kubernetes.io/instance: aegis
    app.kubernetes.io/version: "2.1.1"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis
      app.kubernetes.io/instance: aegis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis
        app.kubernetes.io/instance: aegis
    spec:
      serviceAccountName: default
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: aegis
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          image: "matteos93/aegis:2.1.1"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP   
          livenessProbe:
            httpGet:
              path: /liveness
              port: 2112   
          readinessProbe:
            httpGet:
              path: /readiness
              port: 2112
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config-vol
              mountPath: /etc/config
          env:
            - name: CONFIG_PATH
              value: /etc/config/
          envFrom:
            - secretRef:
                name: aegis-keys
            - secretRef:
                name: aegis-env
      volumes:
        - name: config-vol
          configMap:
            name: aegis-conf
