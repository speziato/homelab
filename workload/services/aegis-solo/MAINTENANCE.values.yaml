# Default values for aegis.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: matteos93/aegis
  pullPolicy: Always
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: false
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"

securityContext:
  capabilities:
    drop:
    - ALL
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault

service:
  type: LoadBalancer
  port: 8080
  annotations:
    tailscale.com/proxy-group: tailscale-ingress
  loadBalancerClass: tailscale

ingress:
  enabled: false
  className: "nginx"
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: aegis
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# -- Kube container resources
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

livenessProbe:
  # -- enable or disable liveness probe
  enabled: true

readinessProbe:
  # -- enable or disable readiness probe
  enabled: true

secret:
  akeys:
    # -- name of the secret storing all the accesskey associated to configured kids
    name: aegis-keys
  injectHeaders:
    # -- optional secret name exposing env vars referenced by config.server.injectHeaders.*.valueFromEnv
    name: "aegis-env"

# -- aegis main configuration describe in the main doc
config:
  {
    "ginmode": "release",
    "loglevel": "info",
    "server":
      {
        "mode": "PLAIN",
        "port": 8080,
        "probesport": 2112,
        "upstream": "api.github.com",
        "dropHeaders": ["Authorization"],
        "injectHeaders":
          [
            {
              "name": "Authorization",
              "valueFromEnv": "GITHUB_TOKEN",
            },
          ],
      },
    "kids": ["solo"],
  }