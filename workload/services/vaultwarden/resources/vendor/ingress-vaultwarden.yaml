# Source: vaultwarden/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: default
  labels:
    app.kubernetes.io/component: vaultwarden
    helm.sh/chart: vaultwarden-0.46.4
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/instance: vaultwarden
    app.kubernetes.io/version: "1.37.5"
    app.kubernetes.io/managed-by: Helm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-sd
    external-dns.alpha.kubernetes.io/hostname: vaultwarden.lan.speziato.dev
    haproxy.org/backend-config-snippet: |
      stick-table type ip size 100k expire 30s store conn_cur
      http-request track-sc1 src
      http-request deny deny_status 429 if { sc1_conn_cur gt 25 }
      http-request deny deny_status 413 if { req.hdr_val(content-length) gt 1073741824 }
    haproxy.org/cors-enable: "true"
    haproxy.org/rate-limit-period: 1s
    haproxy.org/rate-limit-requests: "15"
    haproxy.org/rate-limit-status-code: "429"
    haproxy.org/ssl-redirect: "true"
    haproxy.org/timeout-connect: 10s
    haproxy.org/timeout-server: 1800s
spec:
  ingressClassName: "haproxy"
  tls:
    - hosts:
        - "vaultwarden.lan.speziato.dev"
      secretName: vaultwarden-tls
  rules:
    - host: "vaultwarden.lan.speziato.dev"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: vaultwarden
              port:
                name: "http"
