apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: databases
resources:
- resources/ns.yaml
- resources/objectstore-postgresql.yaml
- resources/immich

secretGenerator:
  - name: postgresql-object-store-backup-credentials
    envs:
      - secrets/barman-object-store-credentials.env
    options:
      disableNameSuffixHash: true
