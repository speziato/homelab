# yaml-language-server: $schema=https://raw.githubusercontent.com/speziato/homelab/main/schemas/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich
spec:
  schedule: "0 10 4 1 * *"  # At 04:10 AM every first day of the month
  backupOwnerReference: self
  cluster:
    name: immich
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
