[tasks.maintenance]
run = '''
#!/usr/bin/env bash

# gh: https://github.com/cloudnative-pg/charts/tree/main/charts/cloudnative-pg
HELM_REPO_URL="https://cloudnative-pg.github.io/charts"
HELM_REPO_NAME="cnpg"
HELM_CHART_NAME="cloudnative-pg"
HELM_CHART_VERSION="0.27.1"
NAMESPACE=operators
RELEASE_NAME=cnpg-operator

helm repo add ${HELM_REPO_NAME} ${HELM_REPO_URL}
helm repo update
rm -rf resources
mkdir -p resources/crds
helm template ${RELEASE_NAME} ${HELM_REPO_NAME}/${HELM_CHART_NAME} --values MAINTENANCE.values.yaml --version "${HELM_CHART_VERSION}"  > deploy.maintenance.yaml
kubectl slice -f deploy.maintenance.yaml -o resources
rm deploy.maintenance.yaml
rm -f resources/-.yaml
mv resources/customresourcedefinition-* resources/crds/
rm -f kustomization.yaml
kustomize init --autodetect --recursive --namespace "${NAMESPACE}"
kustomize build . >/dev/null || (echo "Something went wrong, check upstream for changes" >&2 && exit 1)
'''
[tasks.diff]
description = "Runs a kubectl diff"
run = '''
#!/usr/bin/env bash
kustomize build {{config_root}} | kubectl diff -f -
'''

[tasks.deploy]
description = "Deploys the furyctl plugin, using kapp instead of furyctl - useful to avoid a full furyctl run"
run = '''
#!/usr/bin/env bash

TMPDIR=$(mktemp -d)
OUTFILE="${TMPDIR}/out.yaml"
kustomize build {{config_root}} > "${OUTFILE}"
kapp deploy -a kfd-plugin-tailscale-operator -n kube-system -f "${OUTFILE}" --allow-all-ns -y --default-label-scoping-rules=false --apply-default-update-strategy=fallback-on-replace -c
rm -rf "${TMPDIR}"
'''