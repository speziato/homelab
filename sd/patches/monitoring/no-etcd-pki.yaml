apiVersion: v1
kind: ConfigMap
metadata:
  name: x509-certificate-exporter-control-plane
  namespace: monitoring
data:
  config.yaml: |
    web:
      enableStats: true

    server:
      listen: ":9793"

    log:
      level: info
      format: text

    metrics:
      exposeRelative: false
      exposePerCertError: false
      exposeNotBefore: true
      exposeExpired: true
      exposeDiagnostics: false
      trimPathComponents: 3

    cache:
      filePoll:
        interval: 300s
        skipUnchanged: true

    sources:
      - kind: file
        name: host-paths-control-plane
        followSymlinks: true
        paths:
          - /mnt/watch/file-4e011152ff1166efb100401a2542aa835a398acc/var/lib/kubelet/pki/kubelet-server-current.pem
          - /mnt/watch/file-9dff78b77fe2f4b0f34f77796df3fea5983e5d4b/var/lib/kubelet/pki/kubelet-client-current.pem
          - /mnt/watch/file-24d5fa06386fdaf0d20c51e47b92012ea665b9f5/etc/kubernetes/pki/apiserver.crt
          - /mnt/watch/file-15d8ed7db7457d4f5108195ceb52a124a8703898/etc/kubernetes/pki/ca.crt
          - /mnt/watch/file-99c1687bfbcf4396bdf08131c2971b798d8eb94f/etc/kubernetes/pki/front-proxy-ca.crt
          - /mnt/watch/file-dfdaa9ca375647a99973f96da9f7fd05a44e5e4f/etc/kubernetes/pki/front-proxy-client.crt
        # Map host-namespace path prefixes (where symlink targets are
        # recorded) to the paths the exporter actually sees inside the pod.
        # Mirrors the volume mounts generated in daemonset.yaml. A non-empty
        # list also confines symlink resolution to these scopes — anything
        # that escapes raises x509_source_errors_total{reason="out_of_scope_symlink"}.
        pathMappings:
          - from: "/var/lib/kubelet/pki"
            to: "/mnt/watch/file-4e011152ff1166efb100401a2542aa835a398acc/var/lib/kubelet/pki"
          - from: "/var/lib/kubelet/pki"
            to: "/mnt/watch/file-9dff78b77fe2f4b0f34f77796df3fea5983e5d4b/var/lib/kubelet/pki"
          - from: "/etc/kubernetes/pki"
            to: "/mnt/watch/file-24d5fa06386fdaf0d20c51e47b92012ea665b9f5/etc/kubernetes/pki"
          - from: "/etc/kubernetes/pki"
            to: "/mnt/watch/file-15d8ed7db7457d4f5108195ceb52a124a8703898/etc/kubernetes/pki"
          - from: "/etc/kubernetes/pki"
            to: "/mnt/watch/file-99c1687bfbcf4396bdf08131c2971b798d8eb94f/etc/kubernetes/pki"
          - from: "/etc/kubernetes/pki"
            to: "/mnt/watch/file-dfdaa9ca375647a99973f96da9f7fd05a44e5e4f/etc/kubernetes/pki"
        formats: [pem]
---
