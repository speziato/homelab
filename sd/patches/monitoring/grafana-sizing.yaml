apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  template:
    spec:
      containers:
        - name: grafana
          env:
            - nmame: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - nmame: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - nmame: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: grafana-storage
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: tmp-plugins
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi