apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: renovate
resources:
- resources/pvc-renovate-persistence.yaml
- resources/renovate-job.yaml
configurations:
  - kustomizeconfig.yaml
configMapGenerator:
  - name: renovate-config
    files:
      - config/config.js
      - config/renovate-maintenance.sh
secretGenerator:
  - name: renovate-secret
    options:
      disableNameSuffixHash: true
    envs:
      - secrets/renovate-secret.env
    files:
      - PEM=secrets/github-speziatorenovate-app-key.pem
  - name: git-crypt
    files:
      - secrets/workload.git-crypt.key
images:
  - name: renovate
    newName: ghcr.io/renovatebot/renovate
    newTag: 44.181.5@sha256:9210782ef24244d4c986327f598b832d8c977dba632b6f81c6cedfc28c6d1930
