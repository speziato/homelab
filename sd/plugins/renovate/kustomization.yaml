apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: renovate
resources:
- resources/pvc-renovate-persistence.yaml
- resources/renovate-job.yaml
configurations:
  - kustomizeconfig.yaml
configMapGenerator:
  - name: renovate-config
    files:
      - config/config.js
      - config/renovate-maintenance.sh
secretGenerator:
  - name: renovate-secret
    options:
      disableNameSuffixHash: true
    envs:
      - secrets/renovate-secret.env
    files:
      - PEM=secrets/github-speziatorenovate-app-key.pem
  - name: git-crypt
    files:
      - secrets/workload.git-crypt.key
images:
  - name: renovate
    newName: ghcr.io/renovatebot/renovate
    newTag: 44.222.3@sha256:f3793e09bc66e72b416dceb068a2436474eaa389ed4b4a1b0459be18b62f4863
