apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: renovate
resources:
- resources/pvc-renovate-persistence.yaml
- resources/renovate-job.yaml
configurations:
  - kustomizeconfig.yaml
configMapGenerator:
  - name: renovate-config
    files:
      - config/config.js
      - config/renovate-maintenance.sh
secretGenerator:
  - name: renovate-secret
    options:
      disableNameSuffixHash: true
    envs:
      - secrets/renovate-secret.env
    files:
      - PEM=secrets/github-speziatorenovate-app-key.pem
  - name: git-crypt
    files:
      - secrets/workload.git-crypt.key
images:
  - name: renovate
    newName: ghcr.io/renovatebot/renovate
    newTag: 44.239.1@sha256:0ce4e08df66821d1ad45de9019bf11241dd9bf2af52ec75a9345335b14c83814
