apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: renovate
resources:
- resources/pvc-renovate-persistence.yaml
- resources/renovate-job.yaml
configurations:
  - kustomizeconfig.yaml
configMapGenerator:
  - name: renovate-config
    files:
      - config/config.js
      - config/renovate-maintenance.sh
secretGenerator:
  - name: renovate-secret
    options:
      disableNameSuffixHash: true
    envs:
      - secrets/renovate-secret.env
    files:
      - PEM=secrets/github-speziatorenovate-app-key.pem
  - name: git-crypt
    files:
      - secrets/workload.git-crypt.key
images:
  - name: renovate
    newName: ghcr.io/renovatebot/renovate
    newTag: 44.264.1@sha256:7c6e6274efc81ba9c6c4e7a2124c40a3a04e88d3745a4d1e4c97cb0c6cd33820
