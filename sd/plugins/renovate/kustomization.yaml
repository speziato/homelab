apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: renovate
resources:
- resources/pvc-renovate-persistence.yaml
- resources/renovate-job.yaml
configurations:
  - kustomizeconfig.yaml
configMapGenerator:
  - name: renovate-config
    files:
      - config/config.js
      - config/renovate-maintenance.sh
secretGenerator:
  - name: renovate-secret
    options:
      disableNameSuffixHash: true
    envs:
      - secrets/renovate-secret.env
    files:
      - PEM=secrets/github-speziatorenovate-app-key.pem
  - name: git-crypt
    files:
      - secrets/workload.git-crypt.key
images:
  - name: renovate
    newName: ghcr.io/renovatebot/renovate
    newTag: 45.3.2@sha256:03574aa8ce69bfd39c13cbc9ab9599ded5c0f4772481914ddcfd920882305240
