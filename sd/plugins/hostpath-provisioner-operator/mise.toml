[vars]
OPERATOR_VERSION="v0.23.0"
[tasks.maintenance]
run = '''
rm -rf resources
mkdir resources
curl "https://raw.githubusercontent.com/kubevirt/hostpath-provisioner-operator/main/deploy/namespace.yaml" -o resources/namespace.yaml
curl "https://raw.githubusercontent.com/kubevirt/hostpath-provisioner-operator/main/deploy/webhook.yaml" -o resources/webhook.yaml
curl "https://raw.githubusercontent.com/kubevirt/hostpath-provisioner-operator/main/deploy/operator.yaml" -o resources/operator.yaml
kustomize init --autodetect --recursive --namespace hostpath-provisioner

'''

