apiVersion: apps/v1
kind: Deployment
metadata:
  name: diun
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: diun
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: diun
      annotations:
        diun.enable: "true"
    spec:
      serviceAccountName: diun
      containers:
        - name: diun
          image: ghcr.io/crazy-max/diun:4.31
          imagePullPolicy: Always
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: diun-env
            - secretRef:
                name: diun-telegram-bot
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            # limits:
            #   cpu: 200m
            #   memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          volumeMounts:
            - mountPath: "/data"
              name: "diun-data"
            - mountPath: "/config/diun.yaml"
              subPath: "diun.yaml"
              name: "diun-config"
        - name: exporter
          image: python:3.14-alpine
          command: ["python", "-u", "/app/exporter.py"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          volumeMounts:
            - name: diun-metrics-exporter-script
              mountPath: /app
            - name: diun-metrics
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      restartPolicy: Always
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: "diun-data"
          persistentVolumeClaim:
            claimName: diun-data
        - name: "diun-metrics"
          persistentVolumeClaim:
            claimName: diun-metrics
        - name: diun-config
          configMap:
            name: diun-config
        - name: diun-metrics-exporter-script
          configMap:
            name: diun-metrics-exporter-script
            defaultMode: 0755
