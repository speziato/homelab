sources:
  - service
  # - ingress
  - crd
  - pod
  # - node

triggerLoopOnEvent: true
policy: sync
interval: 5m
domainFilters:
  - speziato.dev
dnsConfig:
  options:
    - name: ndots
      value: "2"
logLevel: info
txtOwnerId: external-dns-homelab
txtPrefix: external-dns-%{record_type}.
provider: 
  name: cloudflare
managedRecordTypes:
  - A
  - CNAME
  - TXT
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token-secret
        key: api-token
extraArgs:
  - --zone-id-filter=6fa74008f12d35ddf5cd594cbd25cbeb
  - --service-type-filter=LoadBalancer
