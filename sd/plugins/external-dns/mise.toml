[tasks.maintenance]
env.CHART_VERSION="1.23.0"
env.NAMESPACE="external-dns"
run="""
#!/usr/bin/env bash

helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
helm repo update
rm -rf resources/vendor
helm template external-dns external-dns/external-dns --include-crds -n "${NAMESPACE}" --values MAINTENANCE.values.yaml --version "${CHART_VERSION}"  > deploy.maintenance.yaml
kubectl slice -f deploy.maintenance.yaml -o resources/vendor
rm deploy.maintenance.yaml
mkdir resources/vendor/crds
mv resources/vendor/customresourcedefinition-* resources/vendor/crds
kubectl create ns "${NAMESPACE}" --dry-run=client -oyaml > resources/ns.yaml
rm kustomization.yaml
kustomize init --autodetect --recursive --namespace "${NAMESPACE}"
kustomize edit add secret cloudflare-api-token-secret --from-env-file ./secrets/cloudflare.env --disableNameSuffixHash
"""

[tasks.diff]
description = "Runs a kapp diff against the furyctl plugin, without deploying anything"
run = '''
#!/usr/bin/env bash
TMPDIR=$(mktemp -d)
OUTFILE="${TMPDIR}/out.yaml"
kustomize build {{config_root}} > "${OUTFILE}"
kapp deploy --diff-run -a kfd-plugin-external-dns -n kube-system -f "${OUTFILE}" --allow-all-ns -y --default-label-scoping-rules=false --apply-default-update-strategy=fallback-on-replace -c
rm -rf "${TMPDIR}"
'''

[tasks.deploy]
description = "Deploys the furyctl plugin, using kapp instead of furyctl - useful to avoid a full furyctl run"
run = '''
#!/usr/bin/env bash

TMPDIR=$(mktemp -d)
OUTFILE="${TMPDIR}/out.yaml"
kustomize build {{config_root}} > "${OUTFILE}"
kapp deploy -a kfd-plugin-external-dns -n kube-system -f "${OUTFILE}" --allow-all-ns --default-label-scoping-rules=false --apply-default-update-strategy=fallback-on-replace -c
rm -rf "${TMPDIR}"
'''