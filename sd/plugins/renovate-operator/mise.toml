[env]
PLUGIN_NAME="renovate-operator"
[tasks._maintenance]
run = '''
#!/usr/bin/env bash
set -euo pipefail

HELM_REPO_URL="oci://ghcr.io/mogenius/helm-charts/renovate-operator"
# renovate: datasource=docker depName=ghcr.io/mogenius/helm-charts/renovate-operator
HELM_CHART_VERSION="6.6.0"
NAMESPACE="renovate"
HELM_RELEASE_NAME="renovate-operator"
# Helm chart repo: https://github.com/mogenius/renovate-operator/

rm -rf vendor
helm template ${HELM_RELEASE_NAME} ${HELM_REPO_URL}:${HELM_CHART_VERSION} --kube-version 1.34.0 --namespace ${NAMESPACE} --no-hooks --values MAINTENANCE.values.yaml > deploy.maintenance.yaml
kubectl slice -f deploy.maintenance.yaml -o vendor -q
rm deploy.maintenance.yaml
rm -f vendor/-.yaml
mkdir vendor/crds
mv vendor/customresourcedefinition-* vendor/crds || true
rm -f kustomization.yaml
kustomize init --autodetect --recursive --namespace "${NAMESPACE}"
kustomize edit add secret renovate-s3-credentials --from-env-file secrets/renovate-s3-credentials.env --disableNameSuffixHash
'''
