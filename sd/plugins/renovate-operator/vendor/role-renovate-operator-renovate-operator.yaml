# Source: renovate-operator/templates/role/role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: renovate-operator-renovate-operator
  namespace: renovate
rules:
  # finalizers subresource required for blockOwnerDeletion on OKD/OpenShift.
  - apiGroups: ["renovate-operator.mogenius.com"]
    resources: ["renovatejobs", "renovatejobs/status", "renovatejobs/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["renovate-operator.mogenius.com"]
    resources: ["renovateprojects", "renovateprojects/status", "renovateprojects/finalizers"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  - apiGroups: ["renovate-operator.mogenius.com"]
    resources: ["renovatejobtemplates"]
    verbs: ["get", "list", "watch"]

  # Allow create, get, list, update, delete on pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]

  # Allow create, get, list, update, delete on jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "update", "delete", "patch"]

  # Allow log access from pods
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]

  # Read platform/webhook tokens by name; create and update the github app token
  # and valkey url secrets. No list/watch: Secrets bypass the informer cache, so a
  # single grant here would otherwise expose every secret value in the namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]

  # Manage the per-job renovate config ConfigMap. No list/watch: ConfigMaps
  # bypass the informer cache like Secrets do; delete cleans up when a job
  # stops using inline config.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete", "list", "watch"]
