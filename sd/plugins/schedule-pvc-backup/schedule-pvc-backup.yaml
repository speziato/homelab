---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: pvc-backup
spec:
  schedule: "0 2 * * *"
  template:
    snapshotMoveData: true
    datamover: velero
    includedNamespaces:
    - 'services'
    excludedNamespaces: null
    includedResources:
    - 'persistentvolumeclaims'
    - 'persistentvolumes'
    excludedResources: null
    includeClusterResources: true
    labelSelector:
      matchLabels:
        backup: velero
    snapshotVolumes: true
    storageLocation: default
    volumeSnapshotLocations:
    - default
    ttl: 360h0m0s
    hooks:
      resources: []