apiVersion: v1
kind: Service
metadata:
  name: talos-apid
  annotations:
    tailscale.com/hostname: talos
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: apid
      port: 50000
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: talos-apid-1
  labels:
    kubernetes.io/service-name: talos-apid
addressType: IPv4
ports:
  - name: apid
    port: 50000
    protocol: TCP
endpoints:
  - addresses: ["192.168.1.10"]