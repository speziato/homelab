apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- additional
- resources/ns.yaml
- vendor/clusterrole-manage-crds-garage-garage.yaml
- vendor/clusterrolebinding-allow-crds-for-garage-garage.yaml
- vendor/configmap-garage-config.yaml
- vendor/ingress-garage-s3-api.yaml
- vendor/ingress-garage-s3-web.yaml
- vendor/service-garage-headless.yaml
- vendor/service-garage-metrics.yaml
- vendor/service-garage.yaml
- vendor/serviceaccount-garage.yaml
- vendor/servicemonitor-garage.yaml
- vendor/statefulset-garage.yaml
namespace: garage
secretGenerator:
- envs:
  - secrets/rpc-secret.env
  name: garage-rpc-secret
  options:
    disableNameSuffixHash: true
  type: Opaque
- envs:
  - secrets/garage-admin-credentials.env
  name: garage-admin-credentials
  options:
    disableNameSuffixHash: true
  type: Opaque
