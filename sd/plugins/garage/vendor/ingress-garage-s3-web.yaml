# Source: garage/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-s3-web
  labels:
    helm.sh/chart: garage-0.10.4
    app.kubernetes.io/name: garage
    app.kubernetes.io/instance: garage
    app.kubernetes.io/version: "v2.5.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-sd
spec:
  tls:
    - hosts:
        - "speziato.dev"
        - "*.web.speziato.dev"
      secretName: garage-web-access
  rules:
    - host: "*.web.speziato.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage
                port:
                  number: 3902
    - host: "speziato.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage
                port:
                  number: 3902
