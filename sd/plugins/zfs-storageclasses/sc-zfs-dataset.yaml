apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs-dataset-128k
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
allowVolumeExpansion: true
parameters:
  recordsize: "128k"
  thinprovision: "no"
  fstype: "zfs"
  poolname: "zfs-pool"
  shared: "yes"
provisioner: zfs.csi.openebs.io