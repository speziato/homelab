apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backups
resources:
- resources/namespace-backups.yaml
- resources/cronjob-backups-sftp-sync.yaml
- resources/cronjob-backups-sftp-cleanup.yaml
- resources/prometheusrule-backups-sftp-sync.yaml

secretGenerator:
  - name: backup-sftp-sync-credentials
    envs:
      - secrets/backup-sftp-sync-credentials.env
  - name: sftp-ssh-key
    files:
      - ssh-key=secrets/keys/ssh-key
configMapGenerator:
  - name: backup-sftp-sync-config
    envs:
      - config/backup-sftp-sync-config.env
images:
  - name: busybox
    newName: busybox
    newTag: stable
  - name: rclone
    newName: ghcr.io/rclone/rclone
    newTag: 1.75.2@sha-256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
