---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backups-sftp-cleanup
spec:
  # Run every Sunday day at 2AM
  schedule: "0 2 * * 0"
  
  # Keep last 3 successful and 1 failed job for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  
  # Don't run concurrent syncs
  concurrencyPolicy: Forbid
  
  # If job is delayed, still run it
  startingDeadlineSeconds: 300
  
  jobTemplate:
    spec:
      # Don't retry failed sync jobs automatically
      backoffLimit: 0
      
      template:
        metadata:
          labels:
            app: backups-sftp-cleanup
        spec:
          restartPolicy: Never
          
          # Init container to set up SSH key permissions
          initContainers:
          - name: setup
            image: busybox:stable
            envFrom:
              - secretRef:
                  name: backup-sftp-sync-credentials
              - configMapRef:
                  name: backup-sftp-sync-config
            command:
              - sh
              - -c
              - |
                mkdir -p /home/user/.ssh
                cp /ssh-key /home/user/.ssh/ssh-key
                chmod 600 /home/user/.ssh/ssh-key
                chmod 700 /home/user/.ssh

                # In the container command
                cat > /home/user/rclone.conf << EOF
                [sftp-remote]
                type = sftp
                host = $SFTP_HOST
                user = $SFTP_USER
                port = $SFTP_PORT
                key_file = /home/user/.ssh/ssh-key

                [sftp-encrypted]
                type = crypt
                filename_encryption = off
                directory_name_encryption = false
                remote = sftp-remote:$SFTP_BACKUP_PATH
                password = $RCLONE_CRYPT_PASSWORD
                password2 = $RCLONE_CRYPT_SALT
                EOF
            securityContext:
              # Run as non-root for better security
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            volumeMounts:
            - name: ssh-key
              mountPath: /ssh-key
              readOnly: true
              subPath: ssh-key
            - name: ssh-home
              mountPath: /home/user
          
          containers:
          - name: rclone-cleanup
            image: docker.io/rclone/rclone:sha-7c16602@sha256:3d7dc78f74b7617cf75aff996bd52e3ed70a31a623777934046070e276535792
            imagePullPolicy: IfNotPresent
            envFrom:
              - configMapRef:
                  name: backup-sftp-sync-config
            command:
              - /bin/sh
              - -c
              - |
                set -e
                
                echo "Starting SFTP archive cleanup at $(date)"
                
                # SFTP endpoint
                SFTP_REMOTE="sftp-encrypted:"
                
                # Archive TTL in days (e.g., 90 days)
                SFTP_TTL_DAYS=${SFTP_TTL_DAYS:-90}
                
                echo "Archive TTL: $SFTP_TTL_DAYS days"
                echo ""

                RCLONE="rclone --config=/home/user/rclone.conf"
                
                # Get list of backup directories
                echo "=== Listing backups on SFTP ==="
                ${RCLONE} \
                  lsf "$SFTP_REMOTE" \
                  --dirs-only \
                  --recursive \
                  --max-depth=1 || echo "No backups found"
                
                echo ""
                echo "=== Finding files older than $SFTP_TTL_DAYS days ==="
                
                # Use rclone to find and delete old files
                # This is safer than raw find because it respects the crypt encryption
                ${RCLONE} \
                  delete "$SFTP_REMOTE" \
                  --min-age ${SFTP_TTL_DAYS}d \
                  --verbose \
                  --progress \
                  --retries=3 \
                  --retries-sleep=5s \
                  --stats=30s
                
                CLEANUP_EXIT=$?
                
                echo ""
                echo "=== Cleanup Summary ==="
                
                # Show remaining backups
                echo "Remaining backups after cleanup:"
                ${RCLONE} \
                  lsf "$SFTP_REMOTE" \
                  --dirs-only \
                  --recursive \
                  --max-depth=1 || echo "No backups remaining"
                
                if [ $CLEANUP_EXIT -eq 0 ]; then
                  echo ""
                  echo "Cleanup completed successfully at $(date)"
                  exit 0
                else
                  echo ""
                  echo "Cleanup completed with warnings/errors (exit code: $CLEANUP_EXIT)"
                  # Don't fail the job for minor errors
                  exit 0
                fi
            
            # Optional: Increase log verbosity for debugging
            # - name: RCLONE_VERBOSE
            #   value: "2"
            
            volumeMounts:
            - name: ssh-home
              mountPath: /home/user
            
            resources:
              requests:
                memory: "256Mi"
                cpu: "500m"
              limits:
                memory: "512Mi"
                cpu: "1000m"
            
            securityContext:
              # Run as non-root for better security
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            
            # Ensure container doesn't hang
            terminationGracePeriodSeconds: 60
          
          # Cleanup on failure
          activeDeadlineSeconds: 7200  # 2 hours timeout
          
          volumes:
          - name: ssh-key
            secret:
              secretName: sftp-ssh-key
              defaultMode: 0644
          - name: ssh-home
            emptyDir: {}
