[vars]
VERSION="v0.15.2"
[tasks.maintenance]
run = '''
#!/usr/bin/env bash
rm -rf ./vendor
rm -rf kustomization.yaml
kustomize localize "github.com/metallb/metallb/config/native?ref={{vars.VERSION}}" vendor
kustomize init --namespace metallb-system
kustomize edit add resource ./vendor/config/native
kustomize edit add resource ./resources/ip-address-pool.yaml
kustomize edit add resource ./resources/l2-advertisement.yaml
kustomize edit add resource ./resources/podmonitor.yaml
'''