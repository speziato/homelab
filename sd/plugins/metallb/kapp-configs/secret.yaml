apiVersion: kapp.k14s.io/v1alpha1
kind: Config
metadata:
  name: dummy-kapp-config-secret # needed so kustomize won't complain
rebaseRules:
  - resourceMatchers:
      - apiVersionKindMatcher:
          apiVersion: v1
          kind: Secret
    paths:
      - [data, ca.crt]
      - [data, ca.key]
      - [data, tls.crt]
      - [data, tls.key]
      - [type]
    type: copy
    sources: [existing, new]
