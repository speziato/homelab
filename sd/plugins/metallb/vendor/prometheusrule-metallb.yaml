# Source: metallb/templates/prometheusrules.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: metallb
  labels:
    helm.sh/chart: metallb-0.16.1
    app.kubernetes.io/name: metallb
    app.kubernetes.io/instance: metallb
    app.kubernetes.io/version: "v0.16.1"
    app.kubernetes.io/managed-by: Helm
spec:
  groups:
  - name: metallb.rules
    rules:
    - alert: MetalLBStaleConfig
      annotations:
        summary: 'Stale config on {{ $labels.pod }}'
        description: '{{ $labels.job }} - MetalLB {{ $labels.container }} on {{ $labels.pod }} has a stale config for > 1 minute'
      expr: metallb_k8s_client_config_stale_bool{job=~"metallb.*"} == 1
      for: 1m
      labels:
        severity: warning
    - alert: MetalLBConfigNotLoaded
      annotations:
        summary: 'Config on {{ $labels.pod }} has not been loaded'
        description: '{{ $labels.job }} - MetalLB {{ $labels.container }} on {{ $labels.pod }} has not loaded for > 1 minute'
      expr: metallb_k8s_client_config_loaded_bool{job=~"metallb.*"} == 0
      for: 1m
      labels:
        severity: warning
    
    - alert: MetalLBAddressPoolExhausted
      annotations:
        summary: 'Exhausted address pool on {{ $labels.pod }}'
        description: '{{ $labels.job }} - MetalLB {{ $labels.container }} on {{ $labels.pod }} has exhausted address pool {{ $labels.pool }} for > 1 minute'
      expr: metallb_allocator_addresses_in_use_total{pool!~""} >= on(pool) metallb_allocator_addresses_total
      for: 1m
      labels:
        severity: critical
    
    - alert: MetalLBAddressPoolUsage75Percent
      annotations:
        summary: 'Exhausted address pool on {{ $labels.pod }}'
        message: '{{ $labels.job }} - MetalLB {{ $labels.container }} on {{ $labels.pod }} has address pool {{ $labels.pool }} past 75% usage for > 1 minute'
      expr: ( metallb_allocator_addresses_in_use_total{pool!~""} / on(pool) metallb_allocator_addresses_total ) * 100 > 75
      labels:
        severity: warning
    - alert: MetalLBAddressPoolUsage85Percent
      annotations:
        summary: 'Exhausted address pool on {{ $labels.pod }}'
        message: '{{ $labels.job }} - MetalLB {{ $labels.container }} on {{ $labels.pod }} has address pool {{ $labels.pool }} past 85% usage for > 1 minute'
      expr: ( metallb_allocator_addresses_in_use_total{pool!~""} / on(pool) metallb_allocator_addresses_total ) * 100 > 85
      labels:
        severity: warning
    - alert: MetalLBAddressPoolUsage95Percent
      annotations:
        summary: 'Exhausted address pool on {{ $labels.pod }}'
        message: '{{ $labels.job }} - MetalLB {{ $labels.container }} on {{ $labels.pod }} has address pool {{ $labels.pool }} past 95% usage for > 1 minute'
      expr: ( metallb_allocator_addresses_in_use_total{pool!~""} / on(pool) metallb_allocator_addresses_total ) * 100 > 95
      labels:
        severity: critical
    - alert: MetalLBBGPSessionDown
      annotations:
        summary:  'BGP session down on {{ $labels.pod }}'
        message: '{{ $labels.job }} - MetalLB {{ $labels.container }} on {{ $labels.pod }} has BGP session {{ $labels.peer }} down for > 1 minute'
      expr: metallb_bgp_session_up{job=~"metallb.*"} == 0
      for: 1m
      labels:
        severity: critical
