apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: haproxy-ingress
  annotations:
    external-dns.kubernetes.io/hostname: ingress-haproxy.lan.speziato.dev
    metallb.io/loadBalancerIPs: 192.168.1.100
  name: haproxy-ingress-lb
  namespace: ingress-haproxy
spec:
  externalTrafficPolicy: Local
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - appProtocol: https
    name: https
    port: 443
    protocol: TCP
    targetPort: https
  selector:
    app.kubernetes.io/instance: haproxy-ingress
    app.kubernetes.io/name: kubernetes-ingress
  sessionAffinity: None
  type: LoadBalancer
