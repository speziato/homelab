apiVersion: v1
kind: Service
metadata:
  labels:
    app: ingress-nginx
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ingress.lan.speziato.dev
  name: ingress-nginx-lb
spec:
  externalTrafficPolicy: Local
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - appProtocol: https
    name: https
    port: 443
    protocol: TCP
    targetPort: https
  selector:
    app: ingress-nginx
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
  sessionAffinity: None
  type: LoadBalancer