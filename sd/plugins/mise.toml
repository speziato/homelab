[tasks._sanity]
run = """
#!/usr/bin/env bash
echo -n "Sanity check... "
[[ -n ${PLUGIN_NAME} ]] || (echo "FAIL - To run this task, set the 'PLUGIN_NAME' env variable" && exit 1)
echo "OK"
"""
[tasks._premaintenance]
run = """
echo "Starting maintenance task for ${PLUGIN_NAME}..."
"""
[tasks._postmaintenance]
run = """
echo "Done maintenance task for ${PLUGIN_NAME}"
"""
[tasks._maintenance]
# default maintenance task - noop
run = """
echo No maintenance
"""

[tasks.maintenance]
run = [
    { task = "_sanity" },
    { task = "_premaintenance" },
    { task = "_maintenance" },
    { task = "_verify" },
    { task = "_postmaintenance" }
]

[tasks.diff]
output="interleave"
description = "Runs a kapp diff against the furyctl plugin, without deploying anything"
run = '''
#!/usr/bin/env bash
mise run deploy -- --diff-run
'''

[tasks.deploy]
output="interleave"
description = "Deploys the furyctl plugin, using kapp instead of furyctl - useful to avoid a full furyctl run"
depends = ["_sanity"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
TMPDIR=$(mktemp -d)
trap 'rm -rf "${TMPDIR}"' EXIT
OUTFILE="${TMPDIR}/out.yaml"
kustomize build {{config_root}}/${PLUGIN_NAME?} > "${OUTFILE}"
kapp deploy -a kfd-plugin-${PLUGIN_NAME:-} -n kube-system -f "${OUTFILE}" --allow-all-ns --default-label-scoping-rules=false --apply-default-update-strategy=fallback-on-replace -c "${@}"
'''

[tasks._verify]
run = """
#!/usr/bin/env bash
echo -n "Verifying that kustomize project builds... "
set -euo pipefail
kustomize build {{config_root}}/${PLUGIN_NAME?} > /dev/null 2>&1 || (echo "FAIL - Something went wrong, check upstream for changes" >&2 && exit 1)
echo "OK"
"""


[tasks.create-plugin]
description = "creates a new plugin folder already configured for the above mise tasks"
usage = '''
arg "<name>" help="New plugin name"
flag "--helm" help="Use the helm maintenance contract"
'''

run = """
#!/usr/bin/env bash

[[ -n ${usage_name} ]] || (echo "You must pass a name for the new plugin" && exit 1)

mkdir -p "{{ config_root }}/${usage_name?}"
cat > "{{ config_root }}/${usage_name?}/mise.toml" << EOF
[env]
PLUGIN_NAME="${usage_name?}"
EOF

if [[ ${usage_helm} == "true" ]]; then
cat >> "{{ config_root }}/${usage_name?}/mise.toml" << EOF
[tasks._maintenance]
run = '''
#!/usr/bin/env bash
set -euo pipefail

HELM_REPO_URL="<repo url>"
HELM_REPO_NAME="<repo name>"
HELM_CHART_NAME="<chart name>"
# renovate: datasource=helm depName=<chart name> registryUrl=<repo url>
HELM_CHART_VERSION="<chart version>"
NAMESPACE="<namespace>"
HELM_RELEASE_NAME="<release name>"
# Helm chart repo: https://<git repo of helm chart>

helm repo add \\${HELM_REPO_NAME} \\${HELM_REPO_URL} > /dev/null
helm repo update > /dev/null
rm -rf resources/vendor
helm template \\${HELM_RELEASE_NAME} \\${HELM_REPO_NAME}/\\${HELM_CHART_NAME} -n "\\${NAMESPACE}" --values MAINTENANCE.values.yaml --version "\\${HELM_CHART_VERSION}"  > deploy.maintenance.yaml
kubectl slice -f deploy.maintenance.yaml -o resources/vendor -q
rm deploy.maintenance.yaml
rm resources/vendor/-.yaml
mkdir resources/vendor/crds
mv resources/vendor/customresourcedefinition-* resources/vendor/crds || true
rm -f kustomization.yaml
kustomize init --autodetect --recursive --namespace "\\${NAMESPACE}"
'''
EOF

touch {{config_root}}/${usage_name?}/MAINTENANCE.values.yaml
fi

PLUGIN_NAME=${usage_name?} yq -i '.spec.plugins.kustomize += [{"name": strenv(PLUGIN_NAME), "folder": "./plugins/"+strenv(PLUGIN_NAME)}]' {{config_root}}/../furyctl.yaml
"""
